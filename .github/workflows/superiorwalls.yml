name: Superiorwalls CI

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        required: true
        type: choice
        options:
          - debug
          - release
          - cleanup
      version:
        description: Release version, for example 2.0
        required: false
        type: string

jobs:
  release:
    if: inputs.action == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/.*versionName = "\([^\"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$current"
          if [[ -n "$REQUESTED_VERSION" && "$current" != "$REQUESTED_VERSION" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match app version $current."
            exit 1
          fi
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "tag=v$current" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/superiorwalls-release.jks
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          ./gradlew assembleRelease

      - name: Verify and prepare APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n1)"
          test -n "$apk"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$build_tools/apksigner" verify "$apk"
          name="Superiorwalls_v${VERSION}.apk"
          cp "$apk" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - name: Generate release changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != "'"$TAG"'")] | sort_by(.publishedAt) | reverse | .[0].tagName // ""')"
          range="${previous_tag:+$previous_tag..}HEAD"
          {
            echo "## What's new"
            echo
            git log "$range" --no-merges --pretty=format:'%s' \
              | sed -nE 's/^(feat|style|ui|fix|perf|security)(\([^)]*\))?:[[:space:]]*//p' \
              | sed '/^[[:space:]]*$/d' \
              | awk '!seen[$0]++ { first=toupper(substr($0,1,1)); print "- " first substr($0,2) }'
            if [[ -n "$previous_tag" ]]; then
              echo
              echo "**Full Changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${TAG}"
            fi
          } > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$TAG" "$APK" \
            --title "Superiorwalls v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest

  debug:
    if: inputs.action == 'debug'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug
      - name: Check debug APK size
        if: inputs.action == 'debug'
        id: apk_size
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "app/build/outputs/apk/debug/app-debug.apk")
          echo "APK size: $SIZE bytes"
          if [[ "$SIZE" -gt 52428800 ]]; then
            echo "large=true" >> "$GITHUB_OUTPUT"
          else
            echo "large=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send debug APK to Telegram
        if: inputs.action == 'debug' && steps.apk_size.outputs.large != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=Superiorwalls debug APK - ${GITHUB_SHA::7}"

      - name: Install Telethon
        if: inputs.action == 'debug' && steps.apk_size.outputs.large == 'true'
        run: python3 -m pip install --disable-pip-version-check telethon==1.45.0 cryptg

      - name: Send large debug APK to Telegram with Telethon
        if: inputs.action == 'debug' && steps.apk_size.outputs.large == 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import asyncio
          import hashlib
          import os
          import time
          from telethon import TelegramClient, custom, helpers, utils
          from telethon.tl import functions, types

          UPLOAD_TIMEOUT = 600
          MAX_ATTEMPTS = 2
          UPLOAD_CONCURRENCY = 4

          class FastTelegramClient(TelegramClient):
              async def upload_file(self, file, *, part_size_kb=None, file_size=None,
                                    file_name=None, use_cache=None, key=None, iv=None,
                                    progress_callback=None):
                  if isinstance(file, (types.InputFile, types.InputFileBig)):
                      return file
                  async with helpers._FileStream(file, file_size=file_size) as stream:
                      file_size = stream.file_size
                      if not part_size_kb:
                          part_size_kb = utils.get_appropriated_part_size(file_size)
                      if part_size_kb > 512:
                          raise ValueError("The part size must be less or equal to 512KB")
                      part_size = int(part_size_kb * 1024)
                      if part_size % 1024 != 0:
                          raise ValueError("The part size must be evenly divisible by 1024")
                      file_id = helpers.generate_random_long()
                      if not file_name:
                          file_name = stream.name or str(file_id)
                      if not os.path.splitext(file_name)[-1]:
                          file_name += utils._get_extension(stream)
                      is_big = file_size > 10 * 1024 * 1024
                      part_count = (file_size + part_size - 1) // part_size
                      hash_md5 = hashlib.md5()
                      parts = []
                      for part_index in range(part_count):
                          part = await helpers._maybe_await(stream.read(part_size))
                          if not isinstance(part, bytes):
                              raise TypeError(f"file descriptor returned {type(part)}, not bytes")
                          if len(part) != part_size and part_index < part_count - 1:
                              raise ValueError(f"read less than {part_size} before reaching the end")
                          if key and iv:
                              from telethon.crypto import AES
                              part = AES.encrypt_ige(part, key, iv)
                          if not is_big:
                              hash_md5.update(part)
                          parts.append(part)
                      uploaded = 0
                      progress_lock = asyncio.Lock()
                      semaphore = asyncio.Semaphore(UPLOAD_CONCURRENCY)
                      async def send_part(part_index, part):
                          nonlocal uploaded
                          async with semaphore:
                              if is_big:
                                  request = functions.upload.SaveBigFilePartRequest(file_id, part_index, part_count, part)
                              else:
                                  request = functions.upload.SaveFilePartRequest(file_id, part_index, part)
                              result = await self(request)
                              if not result:
                                  raise RuntimeError(f"Failed to upload file part {part_index}")
                              async with progress_lock:
                                  uploaded += len(part)
                                  if progress_callback:
                                      await helpers._maybe_await(progress_callback(uploaded, file_size))
                      tasks = [asyncio.create_task(send_part(index, part)) for index, part in enumerate(parts)]
                      try:
                          await asyncio.gather(*tasks)
                      except BaseException:
                          for task in tasks:
                              if not task.done():
                                  task.cancel()
                          await asyncio.gather(*tasks, return_exceptions=True)
                          raise
                      if is_big:
                          return types.InputFileBig(file_id, part_count, file_name)
                      return custom.InputSizedFile(file_id, part_count, file_name, md5=hash_md5, size=file_size)

          async def main():
              api_id = int(os.environ["TELEGRAM_API_ID"])
              api_hash = os.environ["TELEGRAM_API_HASH"]
              bot_token = os.environ["TELEGRAM_BOT_TOKEN"]
              chat_id = int(os.environ["TELEGRAM_CHAT_ID"])
              apk_path = os.environ["APK_PATH"]
              caption = f"Superiorwalls debug APK - {os.environ['GITHUB_SHA'][:7]}"
              file_size = os.path.getsize(apk_path)
              for attempt in range(1, MAX_ATTEMPTS + 1):
                  client = FastTelegramClient(f"superiorwalls-ci-{attempt}", api_id, api_hash, timeout=30, connection_retries=3, request_retries=3, retry_delay=5)
                  started = time.monotonic()
                  last_reported = -1
                  def progress(current, total):
                      nonlocal last_reported
                      percent = int(current * 100 / total) if total else 0
                      if percent >= last_reported + 5 or percent == 100:
                          last_reported = percent
                          elapsed = max(time.monotonic() - started, 0.001)
                          rate = current / elapsed / (1024 * 1024)
                          print(f"Telegram upload: {percent}% ({current}/{total} bytes, {rate:.1f} MiB/s)", flush=True)
                  try:
                      await client.start(bot_token=bot_token)
                      await asyncio.wait_for(client.send_file(chat_id, apk_path, caption=caption, force_document=True, part_size_kb=512, progress_callback=progress), timeout=UPLOAD_TIMEOUT)
                      elapsed = max(time.monotonic() - started, 0.001)
                      print(f"Telegram upload completed successfully in {elapsed:.1f}s ({file_size / elapsed / (1024 * 1024):.2f} MiB/s average).", flush=True)
                      return
                  except asyncio.TimeoutError:
                      print(f"Telegram upload timed out after {UPLOAD_TIMEOUT}s.", flush=True)
                  except Exception as exc:
                      print(f"Telegram upload attempt {attempt} failed: {type(exc).__name__}: {exc}", flush=True)
                  finally:
                      await client.disconnect()
                  if attempt < MAX_ATTEMPTS:
                      print("Waiting before a fresh Telegram connection...", flush=True)
                      await asyncio.sleep(5)
              raise RuntimeError(f"Telegram upload failed after {MAX_ATTEMPTS} attempts.")

          asyncio.run(main())
          PY


  cleanup:
    if: inputs.action == 'cleanup'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "/repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.workflow_id, .id, .created_at] | @tsv' \
            | sort -k1,1 -k3,3r \
            | awk 'seen[$1]++ {print $2}' \
            | xargs -r -I{} gh api --method DELETE "/repos/$REPO/actions/runs/{}"

      - name: Remove old caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "/repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.key, .id, .created_at] | @tsv' \
            | sort -k1,1 -k3,3r \
            | awk 'seen[$1]++ {print $2}' \
            | xargs -r -I{} gh api --method DELETE "/repos/$REPO/actions/caches/{}"