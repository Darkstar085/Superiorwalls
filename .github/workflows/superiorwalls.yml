name: Superiorwalls CI

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to run
        required: true
        type: choice
        options:
          - debug
          - release
          - cleanup
      version:
        description: Release version, for example 2.0
        required: false
        type: string

jobs:
  release:
    if: inputs.action == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/.*versionName = "\([^\"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$current"
          if [[ -n "$REQUESTED_VERSION" && "$current" != "$REQUESTED_VERSION" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match app version $current."
            exit 1
          fi
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "tag=v$current" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/superiorwalls-release.jks
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          ./gradlew assembleRelease

      - name: Verify and prepare APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n1)"
          test -n "$apk"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$build_tools/apksigner" verify "$apk"
          name="Superiorwalls_v${VERSION}.apk"
          cp "$apk" "$name"
          echo "path=$name" >> "$GITHUB_OUTPUT"

      - name: Generate release changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != "'"$TAG"'")] | sort_by(.publishedAt) | reverse | .[0].tagName // ""')"
          range="${previous_tag:+$previous_tag..}HEAD"
          {
            echo "## What's new"
            echo
            git log "$range" --no-merges --pretty=format:'%s' |
              awk '
                {
                  subject=$0
                  type="Changed"
                  if (subject ~ /^feat(\([^)]*\))?:[[:space:]]*/) type="New"
                  else if (subject ~ /^fix(\([^)]*\))?:[[:space:]]*/) type="Fixed"
                  else if (subject ~ /^ci(\([^)]*\))?:[[:space:]]*/) type="CI"
                  else if (subject ~ /^perf(\([^)]*\))?:[[:space:]]*/) type="Performance"
                  else if (subject ~ /^refactor(\([^)]*\))?:[[:space:]]*/) type="Refactor"
                  else if (subject ~ /^(ui|style)(\([^)]*\))?:[[:space:]]*/) type="UI"
                  else if (subject ~ /^security(\([^)]*\))?:[[:space:]]*/) type="Security"
                  else if (subject ~ /^docs(\([^)]*\))?:[[:space:]]*/) type="Docs"
                  else if (subject ~ /^build(\([^)]*\))?:[[:space:]]*/) type="Build"
                  else if (subject ~ /^test(\([^)]*\))?:[[:space:]]*/) type="Tests"
                  else if (subject ~ /^chore(\([^)]*\))?:[[:space:]]*/) type="Chore"
                  sub(/^[^:]+:[[:space:]]*/, "", subject)
                  key=type SUBSEP subject
                  if (!seen[key]++ && subject != "") groups[type]=groups[type] "- " subject "\n"
                }
                END {
                  split("New Fixed CI Performance Refactor UI Security Docs Build Tests Chore Changed", order)
                  for (i=1; i<=12; i++) {
                    type=order[i]
                    if (groups[type] != "") {
                      print "### " type
                      printf "%s", groups[type]
                      print ""
                    }
                  }
                }'
            if [[ -n "$previous_tag" ]]; then
              echo
              echo "**Full Changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${TAG}"
            fi
          } > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$TAG" "$APK" \
            --title "Superiorwalls v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest

  debug:
    if: inputs.action == 'debug'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore debug signing key
        id: debug-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: superiorwalls-debug-keystore-v1

      - name: Generate debug signing key
        if: steps.debug-key.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify debug signing key
        run: keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - run: ./gradlew assembleDebug

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Superiorwalls_${GITHUB_SHA::7}.apk"

      - name: Upload debug APK to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TG_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TG_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -euo pipefail
          APK_PATH="Superiorwalls_${GITHUB_SHA::7}.apk"
          export APK_PATH
          python3 -m pip install --disable-pip-version-check telethon==1.45.0 cryptg
          python3 - <<'PY'
          import asyncio
          import os
          from telethon import TelegramClient

          async def main():
              client = TelegramClient(
                  "superiorwalls-ci",
                  int(os.environ["TELEGRAM_API_ID"]),
                  os.environ["TELEGRAM_API_HASH"],
              )
              await client.start(bot_token=os.environ["TELEGRAM_BOT_TOKEN"])
              last_reported = -5

              def progress(current, total):
                  nonlocal last_reported
                  percent = int(current * 100 / total) if total else 0
                  step = min(100, (percent // 5) * 5)
                  if step >= last_reported + 5:
                      last_reported = step
                      print(f"Telegram upload: {percent}% ({current / 1048576:.1f} MiB / {total / 1048576:.1f} MiB)", flush=True)

              try:
                  await asyncio.wait_for(
                      client.send_file(
                          int(os.environ["TELEGRAM_CHAT_ID"]),
                          os.environ["APK_PATH"],
                          caption=f"Superiorwalls debug APK - {os.environ['GITHUB_SHA'][:7]}",
                          force_document=True,
                          part_size_kb=512,
                          progress_callback=progress,
                      ),
                      timeout=600,
                  )
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY

  cleanup:
    if: inputs.action == 'cleanup'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.workflow_id, .id, .created_at] | @tsv' \
            | sort -k1,1 -k3,3r \
            | awk 'seen[$1]++ {print $2}' \
            | while IFS= read -r run_id; do
                [[ -z "$run_id" ]] && continue
                echo "Deleting workflow run $run_id"
                gh api --method DELETE "/repos/$REPO/actions/runs/$run_id"
              done

      - name: Remove old caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api --paginate "/repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.key, .id, .created_at] | @tsv' \
            | sort -k3,3r \
            | awk '
                {
                  key=$1
                  normalized=key
                  sub(/-[0-9a-f]{40}$/, "", normalized)

                  if (seen[normalized]++) {
                    print $2
                  }
                }
              ' \
            | while IFS= read -r cache_id; do
                [[ -z "$cache_id" ]] && continue
                echo "Deleting stale cache $cache_id"
                gh api --method DELETE "/repos/$REPO/actions/caches/$cache_id"
              done


      - name: Remove expired artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .expired] | @tsv' \
            | while IFS=$'\t' read -r artifact_id expired; do
                [[ -z "$artifact_id" ]] && continue
                if [[ "$expired" == "true" ]]; then
                  echo "Deleting expired artifact $artifact_id"
                  gh api --method DELETE "/repos/$REPO/actions/artifacts/$artifact_id"
                fi
              done
